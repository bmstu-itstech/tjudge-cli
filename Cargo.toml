[package]
name = "tjudge-cli"
version = "1.0.0"
edition = "2024"
authors = ["Kirill Zhikharev <zhikh.k@gmail.com>"]
description = "Tournament Judge CLI for game theory simulations"
license = "MIT"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
timeout-readwrite = "0.4.0"
nix = { version = "0.29.0", default-features = false, features = ["poll"] }
